name: sbornik-vless

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 06:00 МСК
  workflow_dispatch:

jobs:
  sbornik-vless-job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run sbornik main.py
        run: python main.py

      - name: Build subscriptions file
        run: python build_subscriptions.py

      - name: Commit subscriptions and chunks
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add subscriptions subs/*.txt || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update subscriptions and chunks"
            git push
          fi
          
